version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    command: tritonserver --model-repository=/models
    volumes:
      - ./model_repository:/models
    ports:
      - "8000:8000"
  rec-api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - triton
